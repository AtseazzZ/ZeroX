spring:
  application:
    name: ZeroX-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zerox
    username: root
    password: 123456
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 1
  profiles:
    active: local

# The ordinary chat model is created by LangChain4j auto-configuration.
# Keep AI responses uncompressed to avoid the transitive Brotli decoder bug.
langchain4j:
  open-ai:
    chat-model:
      custom-headers:
        Accept-Encoding: identity
    streaming-chat-model:
      custom-headers:
        Accept-Encoding: identity

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.atsea.zerox.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
