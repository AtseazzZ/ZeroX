# Local hosting for ZeroX deployed applications.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 1024;
}

http {
    include D:/develop/nginx-1.22.0-web/conf/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 127.0.0.1:80;
        listen [::1]:80;
        server_name localhost;

        root D:/newCode/JavaVueAI/ZeroX/tmp/code_deploy;
        index index.html;
        charset utf-8;
        autoindex off;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
